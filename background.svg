<svg xmlns="http://www.w3.org/2000/svg" width="4881" height="8623"
     viewBox="0 0 4881 8623" preserveAspectRatio="xMidYMid slice" fill="none">  <!--
       Drawn wall + cast window shadow.

       The wall is a flat cream field. Everything darker is shadow, so it
       all goes through a Gaussian blur rather than being drawn as a hard
       edge. Penumbra widens with distance from the occluder, so there are
       three passes: the frame bars are nearest and softest-but-tight, the
       big light wedge is a long throw and gets the widest blur, and the
       floor / ledge shapes sit between.

       Filter regions are generous (-25% / 150%) so nothing clips at the
       edges when the blur pushes past the viewBox.
  -->
  <defs>
    <filter id="soft-frame" x="-25%" y="-25%" width="150%" height="150%"
            color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="46"/>
    </filter>
    <filter id="soft-wedge" x="-25%" y="-25%" width="150%" height="150%"
            color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="88"/>
    </filter>
    <filter id="soft-floor" x="-25%" y="-25%" width="150%" height="150%"
            color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="62"/>
    </filter>
  </defs>

  <!-- wall: painted past the viewBox so the blur never reveals bare canvas -->
  <rect x="-400" y="-400" width="5681" height="9423" fill="#F0EDE7"/>
  <path d="M159 7848.5L5027 7834.5V8815H159V7848.5Z" fill="#F0EDE7"/>
  <path d="M159 7848.5V129H5027V7834.5L159 7848.5Z" fill="#F0EDE7"/>

  <!-- floor / ledge plane where the wall turns away from the light -->
  <g filter="url(#soft-floor)">
    <path d="M4881 8622.5V8084L1097 8622.5H4881Z" fill="#D6D2C7" stroke="#CAC5BC"/>
    <path d="M4889 7987.65L911.551 8625.89L4013 7964.87L4889 7930.38L4889 7987.65Z"
          fill="#D6D2C7" stroke="#CAC5BC"/>
    <path d="M3545.5 8048.77L422.867 8171.71L444.051 8709.8L3545.5 8048.77Z"
          stroke="#CAC5BC"/>
  </g>
  <!-- window frame bars -->
  <g filter="url(#soft-frame)">
    <rect x="3531" y="334" width="358" height="7484" fill="#CBC5BD"/>
    <rect x="3531" y="334" width="358" height="7484" fill="#CCC7BF"/>
    <rect x="6006.74" y="5601.41" width="146" height="7346"
          transform="rotate(119 6006.74 5601.41)" fill="#CBC5BD"/>
    <rect x="6006.74" y="5601.41" width="146" height="7346"
          transform="rotate(119 6006.74 5601.41)" fill="#CCC7BF"/>
    <line x1="20.0436" y1="7808" x2="4879" y2="7829.17"
          stroke="#CCC7BF" stroke-opacity="0.46" stroke-width="20"/>
    <line x1="20.0436" y1="7808" x2="4879" y2="7829.17"
          stroke="#CCC7BF" stroke-opacity="0.46" stroke-width="20"/>
  </g>

  <!-- the long throw across the wall: darkest, so it sits on top -->
  <g filter="url(#soft-wedge)">
    <path d="M4880.5 0H305L4880.5 2581.5V0Z" fill="#CAC4BC"/>
  </g>

</svg>
